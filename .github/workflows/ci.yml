name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# Default token is read-only. Tag releases need contents:write (see release job).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build SipBotLib.sln -c Release

      - name: Test
        run: dotnet test SipBotLib.sln -c Release --no-build

      - name: Pack
        run: dotnet pack SipBotLib.csproj -c Release --no-build -o dist/nuget

      - name: Publish sipbot linux-x64
        run: |
          dotnet publish tools/sipbot/sipbot.csproj -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -o dist/sipbot-linux-x64
          (cd dist && tar -czf sipbot-linux-x64.tar.gz sipbot-linux-x64)

      - uses: actions/upload-artifact@v4
        with:
          name: sipbot-linux-x64
          path: dist/sipbot-linux-x64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: dist/nuget/*.nupkg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sipbot-linux-x64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: dist/nuget

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sipbot-linux-x64.tar.gz
            dist/nuget/*.nupkg
          fail_on_unmatched_files: true
          overwrite_files: true
